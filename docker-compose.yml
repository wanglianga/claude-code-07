services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-meal_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    # 数据库不发布到宿主端口，仅 compose 内部网络访问

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-meal_platform}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # 后端不直接发布到宿主，由前端 nginx 反向代理 /api

  frontend:
    build: ./frontend
    ports:
      - "${CC_PUBLISH_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
